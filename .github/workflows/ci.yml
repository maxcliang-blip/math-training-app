name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# A new push to main supersedes in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Node 20 is the floor in package.json engines; 22 proves the toolchain
      # does not silently depend on a single runtime.
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    env:
      # Fail instead of warning if the lockfile and package.json disagree.
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        # package.json pins packageManager, so corepack resolves the exact
        # version the lockfile was generated with.
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install (frozen lockfile)
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Report toolchain versions
        run: |
          node --version
          corepack pnpm --version

      - name: Verify lockfile is committed and in sync
        # --frozen-lockfile fails when pnpm-lock.yaml is missing from the commit
        # or drifted from the manifests, which is the failure this step exists to catch.
        run: |
          git ls-files --error-unmatch pnpm-lock.yaml
          corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm -r typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Lint content
        # Content drift is a real failure mode: a malformed exercise frontmatter
        # breaks the lesson viewer at runtime, so it fails the build like code does.
        run: corepack pnpm content:lint

      - name: Test
        run: corepack pnpm -r test

      - name: Build
        run: corepack pnpm build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-node${{ matrix.node }}
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          load: true
          tags: math-training-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke test API container
        run: |
          docker run -d --name api-smoke -p 8080:8080 math-training-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then
              echo "API health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy" >&2
          docker logs api-smoke >&2
          exit 1
        shell: bash
