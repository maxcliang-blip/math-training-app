# Static build of the React app. The API is reached through VITE_API_BASE_URL
# at build time, so the same config serves both the staging host and localhost.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames are immutable, so cache them hard and revalidate HTML.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side router: unknown paths serve the app shell so deep links such as
  # /learn/m1-algebra-foundations/m1-linear-equations and /practice resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;
  gzip_min_length 1024;
}
