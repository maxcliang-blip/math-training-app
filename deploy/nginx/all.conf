# Single-origin production shape: nginx serves the built web app and proxies
# /api to the Node process, so the browser never makes a cross-origin request
# and the app needs no runtime API base URL.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health sits at the API root, outside the /api prefix.
  location = /health {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;
  gzip_min_length 1024;
}
